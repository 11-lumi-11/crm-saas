org: percycastro
app: crm-saas
frameworkVersion: '4'
service: crm-usuarios

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  memorySize: 1024
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${cf:crm-compartido-${sls:stage}.CapaComunArn}
    - ${cf:crm-compartido-${sls:stage}.CapaJwtArn}
  httpApi:
    cors: true
    authorizers:
      authorizerJwt:
        type: request
        functionArn: ${cf:crm-compartido-${sls:stage}.AuthorizerArn}
        identitySource:
          - $request.header.Authorization
        resultTtlInSeconds: 0
        enableSimpleResponses: true
        payloadVersion: '2.0'
  environment:
    JWT_SECRET: ${env:JWT_SECRET}
    JWT_EXPIRACION_HORAS: '1'
    TABLE_TENANTS: ${sls:stage}-t_tenants
    TABLE_USUARIOS: ${sls:stage}-t_usuarios
    TABLE_TENANTS_LOCKS: ${sls:stage}-t_tenants_locks
    TABLE_CORREOS_LOCKS: ${sls:stage}-t_correos_locks
    INDEX_NOMBRE: nombre_normalizado-index
    TABLE_EVENTOS: ${sls:stage}-t_eventos_usuarios
    SNS_TOPIC_ARN: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}

functions:
  publicarEventos:
    handler: crm_comun.eventos.lambda_handler
    timeout: 60
    reservedConcurrency: 1
    events:
      - schedule: rate(1 minute)

  # POST /tenants (público)
  crearTenant:
    handler: src/CrearTenant.lambda_handler
    events:
      - httpApi:
          path: /tenants
          method: post

  # POST /usuarios/login (público)
  loginUsuario:
    handler: src/LoginUsuario.lambda_handler
    events:
      - httpApi:
          path: /usuarios/login
          method: post

  # POST /usuarios (protegido, solo admin)
  crearUsuario:
    handler: src/CrearUsuario.lambda_handler
    events:
      - httpApi:
          path: /usuarios
          method: post
          authorizer:
            name: authorizerJwt

  # GET /usuarios (protegido)
  listarUsuarios:
    handler: src/ListarUsuarios.lambda_handler
    events:
      - httpApi:
          path: /usuarios
          method: get
          authorizer:
            name: authorizerJwt

  # PUT /usuarios/{usuario_id} (protegido, solo admin)
  actualizarUsuario:
    handler: src/ActualizarUsuario.lambda_handler
    events:
      - httpApi:
          path: /usuarios/{usuario_id}
          method: put
          authorizer:
            name: authorizerJwt

resources:
  Resources:
    TablaEventos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_EVENTOS}
        AttributeDefinitions:
          - AttributeName: evento_id
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: fecha_creacion
            AttributeType: S
        KeySchema:
          - AttributeName: evento_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: estado-fecha-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
              - AttributeName: fecha_creacion
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: expira_en
          Enabled: true
        BillingMode: PAY_PER_REQUEST

    # Tabla 1: Tenants (con GSI para verificar nombre de empresa duplicado)
    TablaTenants:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_TENANTS}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: nombre_normalizado
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ${self:provider.environment.INDEX_NOMBRE}
            KeySchema:
              - AttributeName: nombre_normalizado
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
        BillingMode: PAY_PER_REQUEST

    # Tabla 1b: Candados de nombre de empresa (evita registros simultáneos duplicados)
    TablaTenantsLocks:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_TENANTS_LOCKS}
        AttributeDefinitions:
          - AttributeName: nombre_normalizado
            AttributeType: S
        KeySchema:
          - AttributeName: nombre_normalizado
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    TablaCorreosLocks:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_CORREOS_LOCKS}
        AttributeDefinitions:
          - AttributeName: correo
            AttributeType: S
        KeySchema:
          - AttributeName: correo
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    # Tabla 2: Usuarios (con GSI para búsqueda por correo en el Login)
    TablaUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_USUARIOS}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: usuario_id
            AttributeType: S
          - AttributeName: correo
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: usuario_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: correo-index
            KeySchema:
              - AttributeName: correo
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

package:
  patterns:
    - '!.env'
    - '!README.md'
    - '!**/__pycache__/**'
