org: percycastro
app: crm-saas
frameworkVersion: '4'
service: crm-actividades

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  memorySize: 512
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${cf:crm-compartido-${sls:stage}.CapaComunArn}
  httpApi:
    cors: true
    authorizers:
      authorizerJwt:
        type: request
        functionArn: ${cf:crm-compartido-${sls:stage}.AuthorizerArn}
        identitySource:
          - $request.header.Authorization
        resultTtlInSeconds: 0
        enableSimpleResponses: true
        payloadVersion: '2.0'
  environment:
    TABLE_ACTIVIDADES: ${sls:stage}-t_actividades
    TABLE_EVENTOS: ${sls:stage}-t_eventos_actividades
    TABLE_RECIBIDOS: ${sls:stage}-t_eventos_recibidos_actividades
    TABLE_OPORTUNIDADES_CONTROL: ${sls:stage}-t_oportunidades_control_actividades
    INDEX_RESPONSABLE: responsable_id-index
    INDEX_ESTADO: estado-index
    INDEX_OPORTUNIDAD: oportunidad_id-index
    INDEX_FECHA: fecha_programada-index
    SNS_TOPIC_ARN: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}
    DIAS_SEGUIMIENTO_ETAPA: '${env:DIAS_SEGUIMIENTO_ETAPA, "1"}'
    DIAS_INICIO_SERVICIO: '${env:DIAS_INICIO_SERVICIO, "1"}'
    DIAS_SEGUIMIENTO_COTIZACION: '${env:DIAS_SEGUIMIENTO_COTIZACION, "3"}'

functions:
  publicarEventos:
    handler: crm_comun.eventos.lambda_handler
    timeout: 60
    reservedConcurrency: 1
    events:
      - schedule: rate(1 minute)

  procesarEventosActividades:
    handler: src/ProcesarEventosActividades.lambda_handler
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt ColaActividades.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  crearActividad:
    handler: src/CrearActividad.lambda_handler
    events:
      - httpApi:
          path: /actividades
          method: post
          authorizer:
            name: authorizerJwt

  listarActividades:
    handler: src/ListarActividades.lambda_handler
    events:
      - httpApi:
          path: /actividades
          method: get
          authorizer:
            name: authorizerJwt

  obtenerActividad:
    handler: src/ObtenerActividad.lambda_handler
    events:
      - httpApi:
          path: /actividades/{actividad_id}
          method: get
          authorizer:
            name: authorizerJwt

  actualizarActividad:
    handler: src/ActualizarActividad.lambda_handler
    events:
      - httpApi:
          path: /actividades/{actividad_id}
          method: put
          authorizer:
            name: authorizerJwt

  completarActividad:
    handler: src/CompletarActividad.lambda_handler
    events:
      - httpApi:
          path: /actividades/{actividad_id}/completar
          method: put
          authorizer:
            name: authorizerJwt

resources:
  Resources:
    TablaActividades:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_ACTIVIDADES}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: actividad_id
            AttributeType: S
          - AttributeName: responsable_id
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: oportunidad_id
            AttributeType: S
          - AttributeName: fecha_programada
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: actividad_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: responsable_id-index
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: responsable_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: estado-index
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: estado
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: oportunidad_id-index
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: oportunidad_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: fecha_programada-index
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: fecha_programada
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    TablaEventos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_EVENTOS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: evento_id
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: fecha_creacion
            AttributeType: S
        KeySchema:
          - AttributeName: evento_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: estado-fecha-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
              - AttributeName: fecha_creacion
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: expira_en
          Enabled: true

    TablaRecibidos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_RECIBIDOS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: evento_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: evento_id
            KeyType: RANGE

    TablaOportunidadesControl:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_OPORTUNIDADES_CONTROL}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: oportunidad_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: oportunidad_id
            KeyType: RANGE

    ColaActividadesDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${sls:stage}-actividades-dlq
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    ColaActividades:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${sls:stage}-actividades
        VisibilityTimeout: 360
        MessageRetentionPeriod: 345600
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaActividadesDLQ.Arn
          maxReceiveCount: 3

    PoliticaColaActividades:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaActividades
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ColaActividades.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}

    SuscripcionActividades:
      Type: AWS::SNS::Subscription
      DependsOn: PoliticaColaActividades
      Properties:
        TopicArn: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaActividades.Arn
        RawMessageDelivery: false
        FilterPolicy:
          tipo:
            - oportunidad.etapa_cambiada
            - oportunidad.ganada
            - oportunidad.perdida
            - cotizacion.enviada

  Outputs:
    TablaActividadesNombre:
      Value: !Ref TablaActividades
    ColaActividadesArn:
      Value: !GetAtt ColaActividades.Arn

package:
  patterns:
    # Lista permitida: Lambda solo necesita los módulos propios de src.
    # crm_comun llega mediante la capa; boto3/botocore, mediante el runtime.
    - '!**'
    - 'src/**/*.py'
