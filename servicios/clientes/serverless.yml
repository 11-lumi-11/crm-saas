frameworkVersion: '4'
service: crm-clientes

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  memorySize: 1024
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  httpApi:
    cors: true
    authorizers:
      authorizerJwt:
        type: request
        functionArn: ${cf:crm-compartido-${sls:stage}.AuthorizerArn}
        identitySource:
          - $request.header.Authorization
        resultTtlInSeconds: 0
        enableSimpleResponses: true
        payloadVersion: '2.0'
  environment:
    TABLE_CLIENTES: ${sls:stage}-t_clientes
    TABLE_CONTACTOS: ${sls:stage}-t_contactos
    INDEX_CLIENTE: cliente_id-index
    SNS_TOPIC_ARN: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}

functions:

  crearCliente:
    handler: src/CrearCliente.lambda_handler
    events:
      - httpApi:
          path: /clientes
          method: post
          authorizer:
            name: authorizerJwt

  listarClientes:
    handler: src/ListarClientes.lambda_handler
    events:
      - httpApi:
          path: /clientes
          method: get
          authorizer:
            name: authorizerJwt

  obtenerCliente:
    handler: src/ObtenerCliente.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}
          method: get
          authorizer:
            name: authorizerJwt

  actualizarCliente:
    handler: src/ActualizarCliente.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}
          method: put
          authorizer:
            name: authorizerJwt

  eliminarCliente:
    handler: src/EliminarCliente.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}
          method: delete
          authorizer:
            name: authorizerJwt

  crearContacto:
    handler: src/CrearContacto.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}/contactos
          method: post
          authorizer:
            name: authorizerJwt

  listarContactos:
    handler: src/ListarContactos.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}/contactos
          method: get
          authorizer:
            name: authorizerJwt

resources:
  Resources:
    TablaClientes:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_CLIENTES}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: cliente_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: cliente_id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    TablaContactos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_CONTACTOS}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: contacto_id
            AttributeType: S
          - AttributeName: cliente_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: contacto_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ${self:provider.environment.INDEX_CLIENTE}
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: cliente_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

package:
  patterns:
    - '!.env'
    - '!README.md'
