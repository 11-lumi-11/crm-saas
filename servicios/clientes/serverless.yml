org: percycastro
app: crm-saas
frameworkVersion: '4'
service: crm-clientes

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  memorySize: 1024
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${cf:crm-compartido-${sls:stage}.CapaComunArn}
  httpApi:
    cors: true
    authorizers:
      authorizerJwt:
        type: request
        functionArn: ${cf:crm-compartido-${sls:stage}.AuthorizerArn}
        identitySource:
          - $request.header.Authorization
        resultTtlInSeconds: 0
        enableSimpleResponses: true
        payloadVersion: '2.0'
  environment:
    TABLE_CLIENTES: ${sls:stage}-t_clientes
    TABLE_CONTACTOS: ${sls:stage}-t_contactos
    TABLE_VENTAS_RECIBIDAS: ${sls:stage}-t_ventas_recibidas_clientes
    INDEX_CLIENTE: cliente_id-index
    TABLE_EVENTOS: ${sls:stage}-t_eventos_clientes
    SNS_TOPIC_ARN: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}

functions:
  prepararCorreoVenta:
    handler: src/PrepararCorreoVenta.lambda_handler
    events:
      - sqs:
          arn: !GetAtt ColaVentasCorreo.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
  publicarEventos:
    handler: crm_comun.eventos.lambda_handler
    timeout: 60
    reservedConcurrency: 1
    events:
      - schedule: rate(1 minute)

  crearCliente:
    handler: src/CrearCliente.lambda_handler
    events:
      - httpApi:
          path: /clientes
          method: post
          authorizer:
            name: authorizerJwt

  listarClientes:
    handler: src/ListarClientes.lambda_handler
    events:
      - httpApi:
          path: /clientes
          method: get
          authorizer:
            name: authorizerJwt

  obtenerCliente:
    handler: src/ObtenerCliente.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}
          method: get
          authorizer:
            name: authorizerJwt

  actualizarCliente:
    handler: src/ActualizarCliente.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}
          method: put
          authorizer:
            name: authorizerJwt

  crearContacto:
    handler: src/CrearContacto.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}/contactos
          method: post
          authorizer:
            name: authorizerJwt

  listarContactos:
    handler: src/ListarContactos.lambda_handler
    events:
      - httpApi:
          path: /clientes/{cliente_id}/contactos
          method: get
          authorizer:
            name: authorizerJwt

resources:
  Resources:
    TablaVentasRecibidas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_VENTAS_RECIBIDAS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - {AttributeName: tenant_id, AttributeType: S}
          - {AttributeName: evento_id, AttributeType: S}
        KeySchema:
          - {AttributeName: tenant_id, KeyType: HASH}
          - {AttributeName: evento_id, KeyType: RANGE}
    ColaVentasCorreoDLQ:
      Type: AWS::SQS::Queue
      Properties:
        MessageRetentionPeriod: 1209600
    ColaVentasCorreo:
      Type: AWS::SQS::Queue
      Properties:
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaVentasCorreoDLQ.Arn
          maxReceiveCount: 5
    PoliticaVentasCorreo:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues: [!Ref ColaVentasCorreo]
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: {Service: sns.amazonaws.com}
              Action: sqs:SendMessage
              Resource: !GetAtt ColaVentasCorreo.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}
    SuscripcionVentasCorreo:
      Type: AWS::SNS::Subscription
      DependsOn: PoliticaVentasCorreo
      Properties:
        TopicArn: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaVentasCorreo.Arn
        RawMessageDelivery: false
        FilterPolicy:
          tipo: [cotizacion.aceptada]
    TablaEventos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_EVENTOS}
        AttributeDefinitions:
          - AttributeName: evento_id
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: fecha_creacion
            AttributeType: S
        KeySchema:
          - AttributeName: evento_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: estado-fecha-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
              - AttributeName: fecha_creacion
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: expira_en
          Enabled: true
        BillingMode: PAY_PER_REQUEST

    TablaClientes:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_CLIENTES}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: cliente_id
            AttributeType: S
          - AttributeName: responsable_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: cliente_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: responsable_id-index
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: responsable_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    TablaContactos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_CONTACTOS}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: contacto_id
            AttributeType: S
          - AttributeName: cliente_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: contacto_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ${self:provider.environment.INDEX_CLIENTE}
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: cliente_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

package:
  patterns:
    - '!.env'
    - '!README.md'
    - '!**/__pycache__/**'
