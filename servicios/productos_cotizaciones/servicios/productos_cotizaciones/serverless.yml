frameworkVersion: '4'
service: crm-productos-cotizaciones

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  memorySize: 1024
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${cf:crm-compartido-${sls:stage}.CapaComunArn}
  httpApi:
    cors: true
    authorizers:
      authorizerJwt:
        type: request
        functionArn: ${cf:crm-compartido-${sls:stage}.AuthorizerArn}
        identitySource:
          - $request.header.Authorization
        resultTtlInSeconds: 0
        enableSimpleResponses: true
        payloadVersion: '2.0'
  environment:
    TABLE_PRODUCTOS: ${sls:stage}-t_productos
    TABLE_COTIZACIONES: ${sls:stage}-t_cotizaciones
    INDEX_OPORTUNIDAD: oportunidad_id-index
    INDEX_ESTADO: estado-index
    TABLE_EVENTOS: ${sls:stage}-t_eventos_productos_cotizaciones
    SNS_TOPIC_ARN: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}

functions:
  # Publicador del outbox (capa común): envía a SNS los eventos pendientes cada minuto
  publicarEventos:
    handler: crm_comun.eventos.lambda_handler
    timeout: 60
    reservedConcurrency: 1
    events:
      - schedule: rate(1 minute)

  # ---------- Productos ----------
  crearProducto:
    handler: src/CrearProducto.lambda_handler
    events:
      - httpApi:
          path: /productos
          method: post
          authorizer:
            name: authorizerJwt

  listarProductos:
    handler: src/ListarProductos.lambda_handler
    events:
      - httpApi:
          path: /productos
          method: get
          authorizer:
            name: authorizerJwt

  obtenerProducto:
    handler: src/ObtenerProducto.lambda_handler
    events:
      - httpApi:
          path: /productos/{producto_id}
          method: get
          authorizer:
            name: authorizerJwt

  actualizarProducto:
    handler: src/ActualizarProducto.lambda_handler
    events:
      - httpApi:
          path: /productos/{producto_id}
          method: put
          authorizer:
            name: authorizerJwt

  # ---------- Cotizaciones ----------
  crearCotizacion:
    handler: src/CrearCotizacion.lambda_handler
    events:
      - httpApi:
          path: /cotizaciones
          method: post
          authorizer:
            name: authorizerJwt

  listarCotizaciones:
    handler: src/ListarCotizaciones.lambda_handler
    events:
      - httpApi:
          path: /cotizaciones
          method: get
          authorizer:
            name: authorizerJwt

  obtenerCotizacion:
    handler: src/ObtenerCotizacion.lambda_handler
    events:
      - httpApi:
          path: /cotizaciones/{cotizacion_id}
          method: get
          authorizer:
            name: authorizerJwt

  enviarCotizacion:
    handler: src/EnviarCotizacion.lambda_handler
    events:
      - httpApi:
          path: /cotizaciones/{cotizacion_id}/enviar
          method: put
          authorizer:
            name: authorizerJwt

  aceptarCotizacion:
    handler: src/AceptarCotizacion.lambda_handler
    events:
      - httpApi:
          path: /cotizaciones/{cotizacion_id}/aceptar
          method: put
          authorizer:
            name: authorizerJwt

  rechazarCotizacion:
    handler: src/RechazarCotizacion.lambda_handler
    events:
      - httpApi:
          path: /cotizaciones/{cotizacion_id}/rechazar
          method: put
          authorizer:
            name: authorizerJwt

  eliminarCotizacion:
    handler: src/EliminarCotizacion.lambda_handler
    events:
      - httpApi:
          path: /cotizaciones/{cotizacion_id}
          method: delete
          authorizer:
            name: authorizerJwt

resources:
  Resources:
    TablaEventos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_EVENTOS}
        AttributeDefinitions:
          - AttributeName: evento_id
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: fecha_creacion
            AttributeType: S
        KeySchema:
          - AttributeName: evento_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: estado-fecha-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
              - AttributeName: fecha_creacion
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: expira_en
          Enabled: true
        BillingMode: PAY_PER_REQUEST

    TablaProductos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_PRODUCTOS}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: producto_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: producto_id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    TablaCotizaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_COTIZACIONES}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: cotizacion_id
            AttributeType: S
          - AttributeName: oportunidad_id
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: cotizacion_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ${self:provider.environment.INDEX_OPORTUNIDAD}
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: oportunidad_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: ${self:provider.environment.INDEX_ESTADO}
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: estado
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

  Outputs:
    TablaProductosNombre:
      Value: !Ref TablaProductos
    TablaCotizacionesNombre:
      Value: !Ref TablaCotizaciones

package:
  patterns:
    - '!.env'
    - '!README.md'
    - '!**/__pycache__/**'
