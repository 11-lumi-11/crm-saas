frameworkVersion: '4'
service: crm-oportunidades

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  memorySize: 1024
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  httpApi:
    cors: true
    authorizers:
      authorizerJwt:
        type: request
        functionArn: ${cf:crm-compartido-${sls:stage}.AuthorizerArn}
        identitySource:
          - $request.header.Authorization
        resultTtlInSeconds: 0
        enableSimpleResponses: true
        payloadVersion: '2.0'
  environment:
    TABLE_OPORTUNIDADES: ${sls:stage}-t_oportunidades
    TABLE_HISTORIAL: ${sls:stage}-t_historial_etapas
    INDEX_CLIENTE: cliente_id-index
    INDEX_RESPONSABLE: responsable_id-index
    INDEX_ETAPA: etapa-index
    INDEX_HISTORIAL: oportunidad_id-index
    SNS_TOPIC_ARN: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}

functions:

  crearOportunidad:
    handler: src/CrearOportunidad.lambda_handler
    events:
      - httpApi:
          path: /oportunidades
          method: post
          authorizer:
            name: authorizerJwt

  listarOportunidades:
    handler: src/ListarOportunidades.lambda_handler
    events:
      - httpApi:
          path: /oportunidades
          method: get
          authorizer:
            name: authorizerJwt

  obtenerOportunidad:
    handler: src/ObtenerOportunidad.lambda_handler
    events:
      - httpApi:
          path: /oportunidades/{oportunidad_id}
          method: get
          authorizer:
            name: authorizerJwt

  actualizarOportunidad:
    handler: src/ActualizarOportunidad.lambda_handler
    events:
      - httpApi:
          path: /oportunidades/{oportunidad_id}
          method: put
          authorizer:
            name: authorizerJwt

  cambiarEtapa:
    handler: src/CambiarEtapa.lambda_handler
    events:
      - httpApi:
          path: /oportunidades/{oportunidad_id}/etapa
          method: put
          authorizer:
            name: authorizerJwt

  listarHistorial:
    handler: src/ListarHistorial.lambda_handler
    events:
      - httpApi:
          path: /oportunidades/{oportunidad_id}/historial
          method: get
          authorizer:
            name: authorizerJwt

  eliminarOportunidad:
    handler: src/EliminarOportunidad.lambda_handler
    events:
      - httpApi:
          path: /oportunidades/{oportunidad_id}
          method: delete
          authorizer:
            name: authorizerJwt

  # Consumidor SQS: evento cotizacion.aceptada -> oportunidad ganada
  procesarCotizacionAceptada:
    handler: src/ProcesarCotizacionAceptada.lambda_handler
    events:
      - sqs:
          arn: !GetAtt ColaCotizacionAceptada.Arn
          batchSize: 10
          functionResponseTypes:
            - ReportBatchItemFailures

resources:
  Resources:
    TablaOportunidades:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_OPORTUNIDADES}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: oportunidad_id
            AttributeType: S
          - AttributeName: cliente_id
            AttributeType: S
          - AttributeName: responsable_id
            AttributeType: S
          - AttributeName: etapa
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: oportunidad_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ${self:provider.environment.INDEX_CLIENTE}
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: cliente_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: ${self:provider.environment.INDEX_RESPONSABLE}
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: responsable_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: ${self:provider.environment.INDEX_ETAPA}
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: etapa
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    TablaHistorialEtapas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_HISTORIAL}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: historial_id
            AttributeType: S
          - AttributeName: oportunidad_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: historial_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ${self:provider.environment.INDEX_HISTORIAL}
            KeySchema:
              - AttributeName: tenant_id
                KeyType: HASH
              - AttributeName: oportunidad_id
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    ColaCotizacionAceptadaDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${sls:stage}-oportunidades-cotizacion-aceptada-dlq
        MessageRetentionPeriod: 1209600

    ColaCotizacionAceptada:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${sls:stage}-oportunidades-cotizacion-aceptada
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaCotizacionAceptadaDLQ.Arn
          maxReceiveCount: 3

    # Permite que SOLO el topic de eventos del CRM escriba en la cola
    PoliticaColaCotizacionAceptada:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaCotizacionAceptada
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ColaCotizacionAceptada.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}

    SuscripcionCotizacionAceptada:
      Type: AWS::SNS::Subscription
      DependsOn: PoliticaColaCotizacionAceptada
      Properties:
        TopicArn: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaCotizacionAceptada.Arn
        RawMessageDelivery: false
        FilterPolicy:
          tipo:
            - cotizacion.aceptada

package:
  patterns:
    - '!.env'
    - '!README.md'
