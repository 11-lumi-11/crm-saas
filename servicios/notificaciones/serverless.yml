frameworkVersion: '4'
service: crm-notificaciones

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  memorySize: 512
  timeout: 20
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  layers:
    - ${cf:crm-compartido-${sls:stage}.CapaComunArn}
  httpApi:
    cors: true
    authorizers:
      authorizerJwt:
        type: request
        functionArn: ${cf:crm-compartido-${sls:stage}.AuthorizerArn}
        identitySource:
          - $request.header.Authorization
        resultTtlInSeconds: 0
        enableSimpleResponses: true
        payloadVersion: '2.0'
  environment:
    TABLE_NOTIFICACIONES: ${sls:stage}-t_notificaciones
    TABLE_LECTURAS: ${sls:stage}-t_lecturas_notificaciones
    INDEX_DESTINO: destino-index

functions:

  # Consumidor SQS: convierte cada evento del catálogo en uno o más avisos
  procesarEventos:
    handler: src/ProcesarEventos.lambda_handler
    events:
      - sqs:
          arn: !GetAtt ColaNotificaciones.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures

  listarNotificaciones:
    handler: src/ListarNotificaciones.lambda_handler
    events:
      - httpApi:
          path: /notificaciones
          method: get
          authorizer:
            name: authorizerJwt

  marcarLeida:
    handler: src/MarcarLeida.lambda_handler
    events:
      - httpApi:
          path: /notificaciones/{notificacion_id}/leer
          method: put
          authorizer:
            name: authorizerJwt

resources:
  Resources:

    # Un aviso por evento y destino (usuario concreto o rol del tenant)
    TablaNotificaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_NOTIFICACIONES}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: notificacion_id
            AttributeType: S
          - AttributeName: destino
            AttributeType: S
          - AttributeName: orden
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: notificacion_id
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ${self:provider.environment.INDEX_DESTINO}
            KeySchema:
              - AttributeName: destino
                KeyType: HASH
              - AttributeName: orden
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    # Lectura individual: una fila por (aviso, usuario) que lo marcó como leído
    TablaLecturas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_LECTURAS}
        AttributeDefinitions:
          - AttributeName: tenant_id
            AttributeType: S
          - AttributeName: lectura_id
            AttributeType: S
        KeySchema:
          - AttributeName: tenant_id
            KeyType: HASH
          - AttributeName: lectura_id
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    ColaNotificacionesDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${sls:stage}-notificaciones-dlq
        MessageRetentionPeriod: 1209600

    ColaNotificaciones:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${sls:stage}-notificaciones
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaNotificacionesDLQ.Arn
          maxReceiveCount: 3

    # Permite que SOLO el topic de eventos del CRM escriba en la cola
    PoliticaColaNotificaciones:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref ColaNotificaciones
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ColaNotificaciones.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}

    SuscripcionNotificaciones:
      Type: AWS::SNS::Subscription
      DependsOn: PoliticaColaNotificaciones
      Properties:
        TopicArn: ${cf:crm-compartido-${sls:stage}.EventosTopicArn}
        Protocol: sqs
        Endpoint: !GetAtt ColaNotificaciones.Arn
        RawMessageDelivery: false
        FilterPolicy:
          tipo:
            - usuario.creado
            - cliente.creado
            - oportunidad.creada
            - oportunidad.etapa_cambiada
            - oportunidad.ganada
            - oportunidad.perdida
            - cotizacion.enviada
            - cotizacion.aceptada
            - cotizacion.rechazada
            - actividad.completada

package:
  patterns:
    - '!.env'
    - '!README.md'
    - '!**/__pycache__/**'
